name: Extract ivory-romantic zip
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract zip flat to repo root
        run: |
          unzip -o ivory-romantic.zip -d /tmp/extract
          cp -a /tmp/extract/ivory-romantic/. .
          rm -rf /tmp/extract
      - name: Commit extracted files and remove zip and workflow
        run: |
          rm -f ivory-romantic.zip
          rm -rf .github
          git config user.name "jawadupastrajd-hub"
          git config user.email "jawadupastrajd-hub@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Extract ivory-romantic project to repo root" || echo "Nothing to commit"
          git push
