name: Extract zip to repo root

on:
  push:
    paths:
      - ivory-romantic.zip
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract zip flat to repo root
        run: |
          set -e
          unzip -o ivory-romantic.zip -d /tmp/extracted
          if [ -d /tmp/extracted/ivory-romantic ]; then
            cp -a /tmp/extracted/ivory-romantic/. .
          else
            cp -a /tmp/extracted/. .
          fi
          rm -rf /tmp/extracted
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract revised ivory-romantic project to repo root" || echo "Nothing to commit"
          git push
