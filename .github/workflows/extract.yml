name: Extract ivory-romantic zip

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract zip flat to repo root
        run: |
          set -e
          mkdir -p /tmp/unzip
          unzip -o ivory-romantic.zip -d /tmp/unzip
          if [ -d /tmp/unzip/ivory-romantic ]; then
            cp -a /tmp/unzip/ivory-romantic/. .
          else
            cp -a /tmp/unzip/. .
          fi
          rm -f ivory-romantic.zip
          rm -rf .github
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract revised ivory-romantic project to repo root" || echo "nothing to commit"
          git push
