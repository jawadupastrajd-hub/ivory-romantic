name: Extract ivory-romantic.zip
on:
  push:
    branches: [main]
    paths:
      - 'ivory-romantic.zip'
      - '.github/workflows/extract.yml'
  workflow_dispatch:
jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract zip flat to repo root
        run: |
          set -e
          unzip -o ivory-romantic.zip
          if [ -d ivory-romantic ]; then
            cp -a ivory-romantic/. .
            rm -rf ivory-romantic
          fi
          rm -f ivory-romantic.zip
          rm -rf .github
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "Nothing to commit" && exit 0
          git commit -m "Extract revised ivory-romantic project to repo root"
          git push
