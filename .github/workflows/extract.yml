name: Extract revised project
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract zip flat to repo root
        run: |
          set -e
          test -f ivory-romantic.zip
          unzip -o -q ivory-romantic.zip
          cp -a ivory-romantic/. .
          rm -rf ivory-romantic ivory-romantic.zip .github
          git status --short
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract revised ivory-romantic project to repo root" || echo "No changes to commit"
          git push
