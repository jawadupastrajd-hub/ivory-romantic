name: Extract ivory-romantic zip to repo root

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Extract zip flat to repo root
        run: |
          set -e
          rm -rf /tmp/extracted
          mkdir -p /tmp/extracted
          unzip -o ivory-romantic.zip -d /tmp/extracted
          if [ -d /tmp/extracted/ivory-romantic ]; then
            SRC=/tmp/extracted/ivory-romantic
          else
            SRC=/tmp/extracted
          fi
          echo "Extract source: $SRC"
          ls -la "$SRC"
          cp -a "$SRC"/. .
          rm -f ivory-romantic.zip
          while IFS= read -r f; do
            case "$f" in
              .github/*) continue ;;
            esac
            if [ ! -e "$SRC/$f" ]; then
              echo "Removing stale file: $f"
              rm -f "$f"
            fi
          done < <(git ls-files)
          rm -rf .github
          rm -rf /tmp/extracted
          ls -la

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Extract redesigned ivory-romantic project to repo root" || echo "nothing to commit"
          git push
