name: Extract ivory-romantic zip

on:
  push:
    paths:
      - 'ivory-romantic.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract zip flat to repo root
        run: |
          unzip -o ivory-romantic.zip
          cp -a ivory-romantic/. .
          rm -rf ivory-romantic ivory-romantic.zip
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Extract revised ivory-romantic project to repo root"
          git push
