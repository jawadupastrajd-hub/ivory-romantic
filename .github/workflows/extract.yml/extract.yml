name: Extract revised ivory-romantic project
on:
  push:
    paths:
      - 'ivory-romantic.zip'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract zip flat to repo root
        run: |
          unzip -o ivory-romantic.zip -d /tmp/ivory-extract
          cp -a /tmp/ivory-extract/ivory-romantic/. .
          rm -rf ivory-romantic.zip /tmp/ivory-extract
          rm -rf .github
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract revised ivory-romantic project to repo root" || echo "Nothing to commit"
          git push
